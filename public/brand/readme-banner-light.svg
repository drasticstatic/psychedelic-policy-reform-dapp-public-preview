<circle r="1.6" fill="#b8860b"><animateMotion dur="22s" repeatCount="indefinite" begin="-0.0s" path="M 960 402 C 948 330 974 260 960 196"/><animate attributeName="opacity" dur="22s" values="0;.85;.85;0" keyTimes="0;.2;.75;1" repeatCount="indefinite" begin="-0.0s"/></circle>
<circle r="1.6" fill="#b8860b"><animateMotion dur="27s" repeatCount="indefinite" begin="-4.3s" path="M 1004 402 C 992 330 1018 260 1004 196"/><animate attributeName="opacity" dur="27s" values="0;.85;.85;0" keyTimes="0;.2;.75;1" repeatCount="indefinite" begin="-4.3s"/></circle>
