<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">Psychedelic Policy Reform. Religious freedom for sincere sacramental practice, seen from Pennsylvania.</title>
<desc id="d">A quiet docket page breathing slowly behind a stone arch whose golden keystone glows: an open record and evidence library about the Religious Freedom Restoration Act. Not legal advice.</desc>
<style>
.wall{filter:url(#wall)}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 9s ease-in-out infinite}
.breathe.b2{animation-duration:11s;animation-delay:-4s}
.breathe.b3{animation-duration:7s;animation-delay:-2s}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.045);opacity:1}}
.tw{animation:tw 9s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:.95}}
.glow{animation:glow 10s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}.wall{filter:url(#wall-still)}}
</style>
<defs>
<filter id="wall" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.009" numOctaves="2" seed="11" result="n">
    <animate attributeName="baseFrequency" dur="12s" values="0.0045 0.009;0.006 0.0115;0.0045 0.009" repeatCount="indefinite"/>
  </feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feColorMatrix in="d" type="hueRotate" values="0">
    <animate attributeName="values" dur="30s" values="0;6;0;-6;0" repeatCount="indefinite"/>
  </feColorMatrix>
</filter>
<filter id="wall-still" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.009" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<clipPath id="clip"><rect width="1280" height="400" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0" stop-color="#f8f5ec"/><stop offset=".55" stop-color="#f5f1e6"/><stop offset="1" stop-color="#ece4cf"/></linearGradient>
<radialGradient id="key"><stop offset="0" stop-color="#e2b13c" stop-opacity="0.32"/><stop offset="1" stop-color="#e2b13c" stop-opacity="0"/></radialGradient>
<radialGradient id="wash"><stop offset="0" stop-color="#1d6a45" stop-opacity="0.07"/><stop offset="1" stop-color="#1d6a45" stop-opacity="0"/></radialGradient>
</defs>
