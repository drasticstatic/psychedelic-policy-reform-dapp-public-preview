<text x="88" y="262" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="20" font-weight="normal" font-style="italic" letter-spacing="0" fill="#1d6a45">seen from Pennsylvania.</text>
