<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">Psychedelic Policy Reform. Religious freedom for sincere sacramental practice, seen from Pennsylvania.</title>
<desc id="d">A quiet docket page breathing slowly behind a stone arch. Light passes along its stones toward a golden keystone, and a few motes rise through the arch: an open record and evidence library about the Religious Freedom Restoration Act. Not legal advice.</desc>
<style>
.wall{filter:url(#wall)}
.tb{transform-box:fill-box;transform-origin:0% 60%;animation:tb 8.6s ease-in-out infinite}
.tb.t2{animation-duration:9.4s;animation-delay:-3.1s}
.tb.t3{animation-duration:7.8s;animation-delay:-5.4s}
@keyframes tb{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.012);opacity:1}}
.br{transform-box:fill-box;transform-origin:center;animation:br 10.5s ease-in-out infinite}
.br.b2{animation-duration:12.5s;animation-delay:-4s}
.br.b3{animation-duration:8.5s;animation-delay:-2s}
@keyframes br{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.05);opacity:1}}
.drift{animation:drift 38s ease-in-out infinite alternate}
.drift2{animation:drift2 52s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-16px,4px)}to{transform:translate(16px,-6px)}}
@keyframes drift2{from{transform:translate(14px,6px)}to{transform:translate(-18px,-4px)}}
.tw{animation:tw 9s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.95}}
.still{display:none}
.glow{animation:glow 10s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.vw{animation:vw 13s ease-in-out infinite}
@keyframes vw{0%,100%{fill-opacity:.04;stroke-opacity:.42}50%{fill-opacity:.15;stroke-opacity:.72}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.wall{filter:url(#wall-still)}.smil{display:none}.still{display:inline}.draw{stroke-dashoffset:0 !important;opacity:.45}}
</style>
<defs>
<filter id="wall" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0055" numOctaves="2" seed="11" result="n">
    <animate attributeName="baseFrequency" dur="16s" values="0.0028 0.0055;0.0036 0.0068;0.0028 0.0055" repeatCount="indefinite"/>
  </feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feColorMatrix in="d" type="hueRotate" values="0">
    <animate attributeName="values" dur="34s" values="0;6;0;-6;0" repeatCount="indefinite"/>
  </feColorMatrix>
</filter>
<filter id="wall-still" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0055" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<clipPath id="clip"><rect width="1280" height="400" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0" stop-color="#f8f5ec" stop-opacity="1"/><stop offset="0.55" stop-color="#f5f1e6" stop-opacity="1"/><stop offset="1" stop-color="#ece4cf" stop-opacity="1"/></linearGradient>
<radialGradient id="key"><stop offset="0" stop-color="#e2b13c" stop-opacity="0.32"/><stop offset="1" stop-color="#e2b13c" stop-opacity="0"/></radialGradient>
<radialGradient id="wash"><stop offset="0" stop-color="#1d6a45" stop-opacity="0.07"/><stop offset="1" stop-color="#1d6a45" stop-opacity="0"/></radialGradient>
<radialGradient id="mote"><stop offset="0" stop-color="#b8860b" stop-opacity="0.7"/><stop offset="1" stop-color="#b8860b" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="400" fill="url(#bg)"/>
<g class="wall">
<ellipse cx="980" cy="230" rx="420" ry="190" fill="url(#wash)"/>
