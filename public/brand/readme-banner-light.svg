<circle r="1.6" fill="#b8860b"><animateMotion dur="24s" repeatCount="indefinite" begin="-17.2s" path="M 1030 402 C 1018 330 1044 260 1030 196"/><animate attributeName="opacity" dur="24s" values="0;.85;.85;0" keyTimes="0;.2;.75;1" repeatCount="indefinite" begin="-17.2s"/></circle>
</g>
