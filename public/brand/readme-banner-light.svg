<line x1="0" y1="294" x2="1280" y2="294" stroke="#1d6a45" stroke-opacity="0.085" stroke-width="1"/>
<line x1="0" y1="320" x2="1280" y2="320" stroke="#1d6a45" stroke-opacity="0.085" stroke-width="1"/>
<line x1="0" y1="346" x2="1280" y2="346" stroke="#1d6a45" stroke-opacity="0.085" stroke-width="1"/>
<line x1="0" y1="372" x2="1280" y2="372" stroke="#1d6a45" stroke-opacity="0.085" stroke-width="1"/>
<line x1="0" y1="398" x2="1280" y2="398" stroke="#1d6a45" stroke-opacity="0.085" stroke-width="1"/>
<line x1="64" y1="0" x2="64" y2="400" stroke="#b8860b" stroke-opacity=".12" stroke-width="1"/>
</g>
<g fill="#1d6a45" fill-opacity=".05" stroke="#1d6a45" stroke-opacity=".5" stroke-width="1.4">
