<text class="tb " x="88" y="186" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="50" font-style="normal" letter-spacing="-0.5" fill="#12261c">Psychedelic Policy Reform</text>
<text class="tb t2" x="88" y="234" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="20" font-style="italic" letter-spacing="0" fill="#1d6a45">Religious freedom for sincere sacramental practice,</text>
<text class="tb t2" x="88" y="262" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="20" font-style="italic" letter-spacing="0" fill="#1d6a45">seen from Pennsylvania.</text>
