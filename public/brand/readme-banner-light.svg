<rect x="834.0" y="330" width="44" height="74"/>
<rect x="1142.0" y="330" width="44" height="74"/>
</g>
<g class="glow"><circle cx="1010" cy="164" r="120" fill="url(#key)"/></g>
<path class="br" d="M 983.8 147.9 L 1036.2 147.9 L 1028.8 199.3 L 991.2 199.3 Z" fill="#b8860b" stroke="#b8860b" stroke-width="1.2"/>
